<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>可以和我一起约会吗？</title>
<style>
:root{
  --bg1:#f6dde7;--bg2:#d6ebdd;--card:#f5f3f4;--ink:#1c1a1b;--sub:#6d6568;
  --pink:#e25aa4;--pink-soft:#f9d3e6;--tile:#f5c7d5;--on-pink:#1c1a1b;--line:3px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#2b1d25;--bg2:#17251d;--card:#231f21;--ink:#f3edf0;--sub:#b2a8ac;
    --pink:#ee6db4;--pink-soft:#4d2a3d;--tile:#5b3646;--on-pink:#1c1a1b;
  }
}
:root[data-theme="dark"]{
  --bg1:#2b1d25;--bg2:#17251d;--card:#231f21;--ink:#f3edf0;--sub:#b2a8ac;
  --pink:#ee6db4;--pink-soft:#4d2a3d;--tile:#5b3646;--on-pink:#1c1a1b;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:var(--bg1);
  background:linear-gradient(160deg,var(--bg1) 0%,var(--bg1) 35%,var(--bg2) 100%);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
}
.stage{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px 12px}
.card{
  position:relative;width:min(100%,440px);background:var(--card);
  border:var(--line) solid var(--ink);border-radius:28px;box-shadow:6px 7px 0 var(--ink);
  padding:44px 22px 30px;text-align:center;
}
.card[hidden]{display:none}
.card.enter{animation:pop .38s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
.foot{margin-top:18px;font-size:12px;letter-spacing:.04em;color:var(--sub);opacity:.8}

.tile{width:128px;height:128px;margin:0 auto 22px;background:var(--tile);border:var(--line) solid var(--ink);border-radius:22px;box-shadow:4px 5px 0 var(--ink);display:grid;place-items:center}
.tile.sm{width:96px;height:96px;border-radius:18px;margin-bottom:18px}
.seal{width:84%;height:84%}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-2deg)}}

h1{margin:0 0 10px;font-size:clamp(25px,7vw,31px);line-height:1.25;font-weight:800;letter-spacing:.01em}
h1.big{font-size:clamp(28px,8vw,36px)}
.emo{font-size:30px;margin:2px 0 8px;letter-spacing:6px}
.sub{margin:0 0 24px;color:var(--sub);font-size:14px;line-height:1.6}

.btn{
  font:inherit;font-weight:700;font-size:16px;color:var(--ink);cursor:pointer;
  border:var(--line) solid var(--ink);border-radius:999px;background:var(--card);
  box-shadow:3px 4px 0 var(--ink);padding:14px 26px;min-height:52px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .12s,box-shadow .12s,opacity .2s;touch-action:manipulation;user-select:none;-webkit-user-select:none;
}
.btn.pink{background:var(--pink);color:var(--on-pink)}
.btn:active:not(:disabled){transform:translate(3px,4px);box-shadow:0 0 0 var(--ink)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.wide{width:100%;margin-top:22px}
.btn svg{width:18px;height:18px;flex:none}
.btn:focus-visible,.opt:focus-visible,.field:focus-visible,.back:focus-visible{outline:3px solid var(--pink);outline-offset:3px}

.choice{position:relative;display:flex;gap:18px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:70px}
#yes{transition:transform .25s cubic-bezier(.2,1.4,.4,1),box-shadow .12s;min-width:136px;z-index:2}
#noSlot{display:inline-block}
#no{min-width:150px;white-space:nowrap;z-index:3}
#no.flying{position:absolute;transition:left .22s ease,top .22s ease,transform .2s}

.back{position:absolute;left:16px;top:14px;width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.back svg{width:18px;height:18px}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left;margin-top:18px}
.lbl{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;margin-bottom:8px}
.lbl svg{width:17px;height:17px}
.field{
  width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);
  border:var(--line) solid var(--ink);border-radius:16px;box-shadow:3px 4px 0 var(--ink);
  padding:12px 12px;min-height:52px;-webkit-appearance:none;appearance:none;color-scheme:light dark;
}
select.field{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 18px) 22px,calc(100% - 12px) 22px;background-size:6px 6px;background-repeat:no-repeat;padding-right:30px}
.hint{grid-column:1/-1;font-size:13px;color:var(--sub);margin:4px 0 0}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.grid.three{grid-template-columns:repeat(3,1fr);gap:10px}
.opt{
  position:relative;font:inherit;color:var(--ink);text-align:left;cursor:pointer;
  background:var(--card);border:var(--line) solid var(--ink);border-radius:18px;box-shadow:3px 4px 0 var(--ink);
  padding:14px 38px 14px 14px;min-height:56px;display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;
  transition:transform .12s,box-shadow .12s,background .15s;touch-action:manipulation;
}
.opt svg.ic{width:20px;height:20px;flex:none}
.opt.stack{flex-direction:column;align-items:flex-start;gap:10px;min-height:92px}
.opt.stack svg.ic{width:26px;height:26px}
.opt.food{flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px 6px 12px;text-align:center;min-height:90px;font-size:14px}
.opt.food .e{font-size:28px;line-height:1}
.opt::after{content:"";position:absolute;right:12px;top:50%;width:18px;height:18px;margin-top:-9px;border:2.5px solid var(--ink);border-radius:5px;background:var(--card)}
.opt.radio::after,.opt.stack::after,.opt.food::after{border-radius:50%}
.opt.stack::after,.opt.food::after{top:12px;margin-top:0}
.opt.food::after{width:15px;height:15px;right:8px;top:8px}
.opt[aria-pressed="true"]{background:var(--pink-soft);transform:translate(2px,2px);box-shadow:1px 2px 0 var(--ink)}
.opt[aria-pressed="true"]::after{background:var(--pink);box-shadow:inset 0 0 0 3px var(--card)}
.still{margin:20px 0 0;font-size:14px;line-height:1.6;color:var(--sub)}
.still b{color:var(--ink);font-weight:700}

.ticket{margin:6px 0 4px;text-align:left;border:var(--line) dashed var(--ink);border-radius:18px;padding:6px 16px}
.row{display:flex;gap:14px;padding:12px 0;border-bottom:2px dashed color-mix(in srgb,var(--ink) 25%,transparent);font-size:15px;line-height:1.5}
.row:last-child{border-bottom:0}
.row .k{flex:none;width:56px;color:var(--sub)}
.row .v{font-weight:700}
.actions{display:grid;gap:12px;margin-top:22px}
.toast{min-height:20px;margin:12px 0 0;font-size:13px;color:var(--sub)}

.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}
.hearts span{position:absolute;bottom:-40px;font-size:22px;animation:rise 2.8s ease-in forwards}
@keyframes rise{to{transform:translateY(-110vh) rotate(var(--r));opacity:0}}

@media (max-width:360px){
  .card{padding:42px 16px 26px}
  .grid.three{gap:8px}
  .opt{font-size:14px}
  .fields{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01" stroke-width="2.6"/></g></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></g></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M10 4l1.6 4.4L16 10l-4.4 1.6L10 16l-1.6-4.4L4 10l4.4-1.6z"/><path d="M18 3v4M16 5h4M17.5 16.5v3M16 18h3" stroke-linecap="round"/></g></symbol>
    <symbol id="i-fork" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3v7a2 2 0 0 0 2 2v9M10 3v7a2 2 0 0 1-2 2M8 3v6"/><path d="M17 21V3c-2.2 1.2-3 3.8-3 7v3h3"/></g></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-feet" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3.5c2 0 3 2.5 3 5.5s-.8 4-3 4-3-1-3-4 1-5.5 3-5.5zM4.5 16h5v1.5a2.5 2.5 0 0 1-5 0z"/><path d="M17 6c2 0 3 2.5 3 5.5s-.8 4-3 4-3-1-3-4 1-5.5 3-5.5zM14.5 18.5h5V20a2.5 2.5 0 0 1-5 0z"/></g></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M4 10l-.6-3.2L18.5 4l.6 3.2z"/><path d="M8.5 5.8l2 3M13.5 4.9l2 3" stroke-linecap="round"/></g></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4h11v8H8l-4 3z"/><path d="M15 8h5v9l-3.5-2.5H10V12"/></g></symbol>
    <symbol id="seal" viewBox="0 0 120 120">
      <ellipse cx="60" cy="108" rx="36" ry="5" fill="#000" opacity=".1"/>
      <path d="M86 98c10 1 18-3 22-11-1 10-9 17-19 18z" fill="#fbf7f2" stroke="#1c1a1b" stroke-width="3" stroke-linejoin="round"/>
      <path d="M26 104C19 76 27 26 60 24c33 2 41 52 34 80z" fill="#fbf7f2" stroke="#1c1a1b" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="48" cy="47" r="5" fill="#1c1a1b"/><circle cx="49.8" cy="45.2" r="1.7" fill="#fff"/>
      <circle cx="72" cy="47" r="5" fill="#1c1a1b"/><circle cx="73.8" cy="45.2" r="1.7" fill="#fff"/>
      <ellipse cx="41" cy="57" rx="5.5" ry="3.2" fill="#f5a3ba"/><ellipse cx="79" cy="57" rx="5.5" ry="3.2" fill="#f5a3ba"/>
      <ellipse cx="60" cy="54" rx="3" ry="2.1" fill="#1c1a1b"/>
      <path d="M55 58.5q2.5 3.2 5 0q2.5 3.2 5 0" fill="none" stroke="#1c1a1b" stroke-width="2" stroke-linecap="round"/>
      <path d="M50 56h-9M50 59l-8 2M70 56h9M70 59l8 2" stroke="#1c1a1b" stroke-width="1.4" stroke-linecap="round" opacity=".55"/>
      <path d="M60 94C45 85 45 70 53 70c3 0 5.5 2 7 4.5 1.5-2.5 4-4.5 7-4.5 8 0 8 15-7 24z" fill="#f2708f" stroke="#1c1a1b" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="45" cy="82" rx="8" ry="5.5" transform="rotate(-35 45 82)" fill="#fbf7f2" stroke="#1c1a1b" stroke-width="3"/>
      <ellipse cx="75" cy="82" rx="8" ry="5.5" transform="rotate(35 75 82)" fill="#fbf7f2" stroke="#1c1a1b" stroke-width="3"/>
    </symbol>
  </defs>
</svg>

<main class="stage">

  <!-- 1. 邀请 -->
  <section class="card" id="s-ask">
    <div class="tile"><svg class="seal bob"><use href="#seal"/></svg></div>
    <h1 class="big">可以和我一起约会吗？</h1>
    <div class="emo" aria-hidden="true">🥺🫶</div>
    <p class="sub">不急，慢慢选（反正答案只有一个）</p>
    <div class="choice" id="choice">
      <button class="btn pink" id="yes">愿意 <svg><use href="#i-heart"/></svg></button>
      <span id="noSlot"><button class="btn" id="no">不要 no no no</button></span>
    </div>
  </section>

  <!-- 2. 确认 -->
  <section class="card" id="s-sure" hidden>
    <div class="tile sm"><svg class="seal"><use href="#seal"/></svg></div>
    <h1>等一下，<br>你真的点了吗？<br>你真的愿意吗？</h1>
    <div class="emo" aria-hidden="true">😭？？</div>
    <p class="sub">我都已经准备好你点不要了</p>
    <button class="btn pink" data-next="s-when">好啦好啦 <svg><use href="#i-arrow"/></svg></button>
  </section>

  <!-- 3. 日期时间 -->
  <section class="card" id="s-when" hidden>
    <button class="back" aria-label="返回"><svg><use href="#i-back"/></svg></button>
    <h1>所以什么时候能见到你？</h1>
    <div class="fields">
      <div>
        <label class="lbl" for="date"><svg><use href="#i-cal"/></svg>见面日期</label>
        <input class="field" type="date" id="date">
      </div>
      <div>
        <label class="lbl" for="time"><svg><use href="#i-clock"/></svg>见面时间</label>
        <select class="field" id="time"><option value="">选个时间</option></select>
      </div>
      <p class="hint">10:00 到 22:00，都等你</p>
    </div>
    <button class="btn pink wide" id="whenNext" data-next="s-alt" disabled>就这天 <svg><use href="#i-arrow"/></svg></button>
  </section>

  <!-- 4. 备选时间 -->
  <section class="card" id="s-alt" hidden>
    <button class="back" aria-label="返回"><svg><use href="#i-back"/></svg></button>
    <h1>万一那天有变，<br>这些时候也行吗？</h1>
    <p class="sub" style="margin:0">可以多选，也可以都不选</p>
    <div class="grid" id="altGrid" data-mode="multi" data-key="alt"></div>
    <p class="still">见面时间仍是<br><b id="stillWhen"></b></p>
    <button class="btn pink wide" data-next="s-how">暗示给你了 <svg><use href="#i-arrow"/></svg></button>
  </section>

  <!-- 5. 怎么见 -->
  <section class="card" id="s-how" hidden>
    <button class="back" aria-label="返回"><svg><use href="#i-back"/></svg></button>
    <h1>那天想怎么见面？</h1>
    <div class="grid" id="howGrid" data-mode="single" data-key="how"></div>
    <button class="btn pink wide" id="howNext" data-next="s-food" disabled>就这样见面吧 <svg><use href="#i-arrow"/></svg></button>
  </section>

  <!-- 6. 吃什么 -->
  <section class="card" id="s-food" hidden>
    <button class="back" aria-label="返回"><svg><use href="#i-back"/></svg></button>
    <h1>我们吃点什么？</h1>
    <div class="grid three" id="foodGrid" data-mode="single" data-key="food"></div>
    <button class="btn pink wide" id="foodNext" data-next="s-done" disabled>就吃这个 <svg><use href="#i-arrow"/></svg></button>
  </section>

  <!-- 7. 完成 -->
  <section class="card" id="s-done" hidden>
    <div class="tile sm"><svg class="seal bob"><use href="#seal"/></svg></div>
    <h1>约好啦！</h1>
    <p class="sub" style="margin-bottom:14px">不许反悔，我已经开始期待了</p>
    <div class="ticket" id="ticket"></div>
    <div class="actions">
      <button class="btn pink" id="copy">复制结果发给我</button>
      <button class="btn" id="again">重新选一遍</button>
    </div>
    <p class="toast" id="toast" role="status">也可以直接截图这一页发我</p>
  </section>

  <p class="foot">made for the two of us</p>
</main>

<div class="hearts" id="hearts" aria-hidden="true"></div>

<script>
(function(){
  var $ = function(s){return document.querySelector(s)};
  var state = {date:'', time:'', alt:[], how:'', food:''};
  var history = [];
  var current = 's-ask';

  var ALT = [
    ['i-clock','今天晚上'],['i-cal','明天'],['i-cal','这个周末'],['i-heart','你来定'],
    ['i-spark','午后'],['i-spark','傍晚'],['i-fork','晚饭后'],['i-star','夜一点也行']
  ];
  var HOW = [
    ['i-feet','轻松散步'],['i-fork','吃点好吃的'],['i-film','看电影不说话也行'],
    ['i-chat','找个地方慢慢聊'],['i-heart','有点暧昧'],['i-spark','像第一次约会']
  ];
  var FOOD = [
    ['🍣','日料'],['🥩','烤肉'],['🥟','粤菜'],['🍲','火锅'],['🍢','烧烤'],
    ['🖤','黑珍珠'],['⭐','米其林'],['🍝','西餐'],['🍰','甜品咖啡']
  ];

  // ---------- navigation ----------
  function go(id, isBack){
    if(id === current) return;
    if(!isBack) history.push(current);
    document.getElementById(current).hidden = true;
    var el = document.getElementById(id);
    el.hidden = false;
    el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter');
    current = id;
    if(id === 's-alt') $('#stillWhen').textContent = fmtWhen();
    if(id === 's-done'){ renderTicket(); burst(); }
    window.scrollTo(0,0);
  }
  document.addEventListener('click', function(e){
    var n = e.target.closest('[data-next]');
    if(n && !n.disabled){ go(n.getAttribute('data-next')); return; }
    if(e.target.closest('.back')){ var prev = history.pop(); if(prev) go(prev, true); }
  });

  // ---------- step 1: the runaway "no" ----------
  var yes = $('#yes'), no = $('#no'), slot = $('#noSlot'), card = $('#s-ask');
  var tries = 0, lastDodge = 0;
  var NO_TEXT = ['不要 no no no','真的不要吗？','再想想嘛','点不到的～','别挣扎啦','只能点愿意哦','愿意吧愿意吧'];
  function dodge(e){
    if(e){ e.preventDefault(); e.stopPropagation(); }
    var t = Date.now();
    if(t - lastDodge < 280) return;
    lastDodge = t;
    tries++;
    no.textContent = NO_TEXT[Math.min(tries, NO_TEXT.length-1)];
    if(!no.classList.contains('flying')){
      slot.style.width = no.offsetWidth + 'px';
      slot.style.height = no.offsetHeight + 'px';
      var c0 = card.getBoundingClientRect(), b0 = no.getBoundingClientRect();
      no.style.left = (b0.left - c0.left) + 'px';
      no.style.top = (b0.top - c0.top) + 'px';
      card.appendChild(no);
      no.classList.add('flying');
      void no.offsetWidth;
    }
    var cw = card.clientWidth, ch = card.clientHeight;
    var bw = no.offsetWidth, bh = no.offsetHeight, pad = 14;
    var cr = card.getBoundingClientRect(), yr = yes.getBoundingClientRect();
    var ybox = {l:yr.left-cr.left-16, t:yr.top-cr.top-16, r:yr.right-cr.left+16, b:yr.bottom-cr.top+16};
    var curL = parseFloat(no.style.left)||0, curT = parseFloat(no.style.top)||0;
    var x, y, ok = false;
    for(var i=0;i<40 && !ok;i++){
      x = pad + Math.random()*Math.max(1, cw - bw - pad*2);
      y = pad + Math.random()*Math.max(1, ch - bh - pad*2);
      var hitYes = !(x+bw < ybox.l || x > ybox.r || y+bh < ybox.t || y > ybox.b);
      var far = Math.abs(x-curL) + Math.abs(y-curT) > 90;
      ok = !hitYes && far;
    }
    no.style.left = x + 'px'; no.style.top = y + 'px';
    var shrink = Math.max(.7, 1 - tries*0.04);
    no.style.transform = 'scale(' + shrink + ')';
    yes.style.transform = 'scale(' + Math.min(1.45, 1 + tries*0.07) + ')';
  }
  no.addEventListener('pointerenter', function(e){ if(e.pointerType === 'mouse') dodge(); });
  no.addEventListener('pointerdown', dodge);
  no.addEventListener('touchstart', dodge, {passive:false});
  no.addEventListener('click', dodge);
  no.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' ') dodge(e); });
  yes.addEventListener('click', function(){ go('s-sure'); });

  // ---------- step 3: date & time ----------
  var dateEl = $('#date'), timeEl = $('#time');
  var now = new Date();
  function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  dateEl.min = ymd(now);
  for(var h=10; h<=22; h++){
    ['00','30'].forEach(function(m){
      if(h===22 && m==='30') return;
      var o = document.createElement('option');
      o.value = o.textContent = String(h).padStart(2,'0')+':'+m;
      timeEl.appendChild(o);
    });
  }
  function checkWhen(){
    state.date = dateEl.value; state.time = timeEl.value;
    $('#whenNext').disabled = !(state.date && state.time);
  }
  dateEl.addEventListener('input', checkWhen); dateEl.addEventListener('change', checkWhen);
  timeEl.addEventListener('change', checkWhen);

  function fmtWhen(){
    if(!state.date) return '';
    var p = state.date.split('-'), d = new Date(+p[0], +p[1]-1, +p[2]);
    var wk = '日一二三四五六'[d.getDay()];
    return (+p[1]) + '月' + (+p[2]) + '日 周' + wk + ' ' + state.time;
  }

  // ---------- option grids ----------
  function build(gridId, items, kind, nextBtn){
    var grid = document.getElementById(gridId);
    var mode = grid.getAttribute('data-mode'), key = grid.getAttribute('data-key');
    items.forEach(function(it){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt ' + (kind||'') + (mode==='single' ? ' radio' : '');
      b.setAttribute('aria-pressed','false');
      b.dataset.v = it[1];
      if(kind === 'food'){
        b.innerHTML = '<span class="e" aria-hidden="true">'+it[0]+'</span><span></span>';
        b.lastChild.textContent = it[1];
      } else {
        b.innerHTML = '<svg class="ic" aria-hidden="true"><use href="#'+it[0]+'"/></svg><span></span>';
        b.lastChild.textContent = it[1];
      }
      b.addEventListener('click', function(){
        if(mode === 'multi'){
          var on = b.getAttribute('aria-pressed') !== 'true';
          b.setAttribute('aria-pressed', on);
          state[key] = [].filter.call(grid.children, function(x){return x.getAttribute('aria-pressed')==='true'}).map(function(x){return x.dataset.v});
        } else {
          [].forEach.call(grid.children, function(x){ x.setAttribute('aria-pressed','false'); });
          b.setAttribute('aria-pressed','true');
          state[key] = b.dataset.v;
          if(nextBtn) $(nextBtn).disabled = false;
        }
      });
      grid.appendChild(b);
    });
  }
  build('altGrid', ALT, '', null);
  build('howGrid', HOW, 'stack', '#howNext');
  build('foodGrid', FOOD, 'food', '#foodNext');

  // ---------- done ----------
  function rows(){
    var r = [['见面', fmtWhen()]];
    if(state.alt.length) r.push(['也可以', state.alt.join('、')]);
    r.push(['怎么见', state.how], ['吃什么', state.food]);
    return r;
  }
  function renderTicket(){
    var t = $('#ticket'); t.innerHTML = '';
    rows().forEach(function(x){
      var d = document.createElement('div'); d.className = 'row';
      var k = document.createElement('span'); k.className='k'; k.textContent = x[0];
      var v = document.createElement('span'); v.className='v'; v.textContent = x[1];
      d.appendChild(k); d.appendChild(v); t.appendChild(d);
    });
    $('#toast').textContent = '也可以直接截图这一页发我';
  }
  function copyText(txt){
    if(navigator.clipboard && window.isSecureContext){
      return navigator.clipboard.writeText(txt).catch(function(){ return legacy(txt); });
    }
    return legacy(txt);
  }
  function legacy(txt){
    return new Promise(function(res, rej){
      var ta = document.createElement('textarea');
      ta.value = txt; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, 99999);
      var ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta); ok ? res() : rej();
    });
  }
  $('#copy').addEventListener('click', function(){
    var txt = '我愿意！🫶\n' + rows().map(function(x){return x[0]+'：'+x[1]}).join('\n');
    copyText(txt).then(function(){
      $('#toast').textContent = '已复制，去粘贴给我吧';
    }, function(){
      $('#toast').textContent = '复制没成功，截图这一页发我也一样';
    });
  });
  $('#again').addEventListener('click', function(){
    history = ['s-ask','s-sure'];
    go('s-when', true);
  });

  function burst(){
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var box = $('#hearts'), set = ['💗','💕','🩷','✨','💞'];
    for(var i=0;i<22;i++){
      var s = document.createElement('span');
      s.textContent = set[i % set.length];
      s.style.left = (Math.random()*100) + 'vw';
      s.style.animationDelay = (Math.random()*0.9) + 's';
      s.style.fontSize = (16 + Math.random()*16) + 'px';
      s.style.setProperty('--r', (Math.random()*80-40) + 'deg');
      box.appendChild(s);
    }
    setTimeout(function(){ box.innerHTML=''; }, 4200);
  }
})();
</script>
</body>
</html>
